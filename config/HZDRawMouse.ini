; HZDRawMouse 1.0.1 — raw mouse camera for Horizon Zero Dawn (Complete Edition, PC)
; Keep this file next to HZDRawMouse.asi. Values in hex accept the 0x prefix.

[Mouse]
; Camera mode at startup: 5 = raw camera (this fix), 0 = the game's original mouse camera.
StartMode=5
; Key that toggles between the raw camera and the original camera while playing
; (virtual-key code, default 0x78 = F9; 0 disables the toggle).
ToggleKey=0x78
; Beep when toggling (high = raw camera, low = original). 0 = silent.
Beep=1

[Log]
; HZDRawMouse.log next to the plugin: version and hook status at startup (useful for bug reports).
Enable=1
