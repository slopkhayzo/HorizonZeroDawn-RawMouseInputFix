; HZDRawMouse — DEVELOPMENT configuration (deploy.bat / tools\live_test.ps1 install this one).
; The release configuration is config\HZDRawMouse.ini.

[Log]
; Summary log (HZDRawMouse.log): hook status, and with Stats=1 once-per-second statistics.
Enable=1
Stats=1
; Per-event CSV (HZDRawMouse_events.csv): every raw packet / poll / state read / present.
; Grows ~100 KB/s with a 1000 Hz mouse — enable for short test sessions.
EventCsv=1

[Hooks]
; Count frames via IDXGISwapChain::Present (frame timing diagnostics).
Present=1

[Mouse]
; 0 = original game behaviour, 5 = raw camera (see [Experimental] for the research modes 1..4).
StartMode=5
; F9 toggles raw camera (5) <-> original (0).
ToggleKey=0x78
Beep=1

[Experimental]
; Mouse modes (StartMode above):
;   0 = original game behaviour (33.3 ms poll throttle)
;   1 = throttle removed (per-frame delta, camera still scales it down -> low sensitivity)
;   2 = throttle removed + compensation (delta scaled by 33.3 ms / frame interval)
;   3 = mode 2 + the per-frame delta is written into the player's 30 Hz input buffer every frame
;   4 = tick-exact: each 30 Hz camera tick gets exactly the raw counts since the previous tick,
;       and the camera's look smoothing (N-tick moving average + slew limiter) is bypassed
;   5 = raw camera: mode 4 + linear camera response + no angular acceleration limit, and both
;       render-interpolation endpoints of the camera are kept at (tick pose + raw counts not yet
;       applied) every frame
; F9 with CycleAllModes=1 cycles 0 -> 1 -> ... -> 5 instead of toggling 5 <-> 0.
CycleAllModes=0
; Diagnostic hotkeys (virtual-key codes, 0 = off):
;   F8  writes a MARK into the logs
;   F10 arms/disarms the hardware watchpoints on the camera entity transform / look vector
;   F11 toggles the world clock step divider 2 <-> 1 (experiment; no effect on the camera tick)
;   F12 cycles a constant 20-degree camera twist through one render path at a time
MarkerKey=0x77
WatchKey=0x79
SimDividerKey=0x7A
DebugPathKey=0x7B
